[package]
name = "ihub"
version = "0.1.3"
description = "A fast, extensible desktop command hub"
authors = ["iHub contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ihub_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fuzzy-matcher = "0.3"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "tiff", "webp"] }
jsonschema = { version = "0.26.2", default-features = false }
notify = "6.1"
ib-pinyin = { version = "=0.3.1", default-features = false }
rayon = "1.10"
regex = "1"
ring = "0.17"
# Use Rustls with ring rather than enabling reqwest's AWS-LC default. This keeps
# the first-party WebDAV client on the same pure-Rust TLS path already used by
# the desktop stack and avoids introducing a second crypto provider/toolchain.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "socks", "stream"] }
rfd = { version = "0.15.4", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["fs"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
url = "2.5"
unicode-normalization = "=0.1.25"
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
notify-rust = "4.18"
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_WiFi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_WinRT",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Variant",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
