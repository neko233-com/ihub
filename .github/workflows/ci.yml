name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows build
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - name: macOS build
            runner: macos-latest
            rust-target: aarch64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore locked official plugin checkouts
        run: pnpm bootstrap:official-plugins

      - name: Type-check frontend
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build plugin SDK and template
        shell: bash
        run: |
          pnpm --dir plugin-sdk run check
          pnpm --dir plugin-sdk run build
          pnpm --dir examples/ihub-plugin-hello run build

      - name: Verify immutable official plugin locks
        run: pnpm verify:official-plugins -- --strict-worktree

      - name: Rebuild official plugins
        run: pnpm verify:official-plugin-builds

      # --no-bundle keeps CI free from signing/notarization requirements while
      # still compiling the Rust binary and exercising Tauri's build pipeline.
      - name: Build Tauri application
        run: pnpm tauri build --no-bundle
